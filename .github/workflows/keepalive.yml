# Supabase 免费项目连续 7 天没有活动会被暂停，这里每 3 天访问一次数据库保持活跃
# 注意：公开仓库 60 天没有新提交时，GitHub 会自动停用定时任务，届时去 Actions 页面重新启用即可
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: https://whyjnneqttffqjaydhen.supabase.co
          SUPABASE_KEY: sb_publishable_h_LTzpGqOm3fE9VepzbZjg_hruMn_pL
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
