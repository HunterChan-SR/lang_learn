# 推送 v* 标签时自动打包桌面版（macOS / Windows）并发布到 GitHub Releases
# 发版：npm version patch（或 minor）&& git push --follow-tags
# 也可以在 Actions 页面手动运行，只打包不发布，安装包在运行结果的 Artifacts 里
name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Windows
            os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 package.json 的版本 ${version} 不一致"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # 没有代码签名证书：macOS 使用临时签名，Windows 不签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - run: ls -la assets

      - name: Version without v
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 安装包 |
            |---|---|
            | macOS（Apple 芯片：M1/M2/M3/M4…） | `CET-Words-${{ steps.ver.outputs.version }}-mac-arm64.dmg` |
            | macOS（Intel 芯片） | `CET-Words-${{ steps.ver.outputs.version }}-mac-x64.dmg` |
            | Windows 10 / 11（64 位） | `CET-Words-${{ steps.ver.outputs.version }}-win-x64-setup.exe` |

            ## 首次打开

            安装包没有购买苹果和微软的代码签名证书，系统会提示无法验证开发者，按下面操作一次即可：

            - **macOS**：把应用拖进“应用程序”后打开；如果提示无法打开，到 **系统设置 → 隐私与安全性**，在页面底部点 **仍要打开**。
              如果提示“已损坏”，在终端运行 `xattr -cr /Applications/四六级单词.app` 后再打开。
            - **Windows**：如果出现“Windows 已保护你的电脑”，点 **更多信息 → 仍要运行**。

            桌面版和网页版功能相同，另外：离线可用；AI 服务不受浏览器跨域限制（Kimi、智谱、Gemini 也能直接用）；登录在系统浏览器中完成。
