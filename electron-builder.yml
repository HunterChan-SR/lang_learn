# 桌面版打包配置（electron-builder）：npm run desktop:dist
# GitHub Actions 在推送 v* 标签时自动打包 macOS / Windows 安装包并发布到 Releases，见 .github/workflows/release.yml
appId: io.github.hunterchan-sr.cetwords
productName: langLearn
copyright: Copyright © 2026 HunterChan
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - desktop/**/*
  - package.json
# 网页代码已由 Vite 打包进 dist/，package.json 里没有运行时依赖，不会打包 node_modules
npmRebuild: false
protocols:
  - name: langLearn 登录回调
    schemes:
      - cet-words
publish: null

mac:
  category: public.app-category.education
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: langLearn-${version}-mac-${arch}.${ext}
  # 没有 Apple 开发者证书：使用临时签名（ad-hoc），首次打开需要在“隐私与安全性”里允许
  identity: '-'
  hardenedRuntime: false
dmg:
  title: langLearn ${version}
  artifactName: langLearn-${version}-mac-${arch}.${ext}

win:
  icon: build/icon-win.png
  executableName: langLearn
  target:
    - target: nsis
      arch: [x64]
  artifactName: langLearn-${version}-win-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: langLearn
  uninstallDisplayName: langLearn
  installerLanguages: [zh_CN]
  language: '2052'
